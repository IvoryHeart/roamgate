<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">Northstar board map</title>
  <desc id="description">Six fictional tasks grouped into to do, in progress, and done columns.</desc>
  <rect width="960" height="540" fill="#10151e"/>
  <g font-family="sans-serif">
    <text x="48" y="64" fill="#8de4ca" font-size="15" letter-spacing="3">NORTHSTAR / SPRINT 01</text>
    <text x="48" y="110" fill="#e8edf3" font-size="32" font-weight="700">From idea to ready.</text>
    <text x="48" y="143" fill="#a8b4c5" font-size="16">Small changes, visible progress, one local workspace.</text>
    <rect x="48" y="190" width="272" height="286" rx="16" fill="#1b2533" stroke="#344055"/>
    <rect x="344" y="190" width="272" height="286" rx="16" fill="#1b2533" stroke="#344055"/>
    <rect x="640" y="190" width="272" height="286" rx="16" fill="#1b2533" stroke="#344055"/>
    <text x="72" y="229" fill="#d1dceb" font-size="18" font-weight="700">To do</text>
    <text x="368" y="229" fill="#f7d58b" font-size="18" font-weight="700">In progress</text>
    <text x="664" y="229" fill="#99e1bc" font-size="18" font-weight="700">Done</text>
    <g fill="#253143">
      <rect x="72" y="253" width="224" height="84" rx="8"/>
      <rect x="72" y="356" width="224" height="84" rx="8"/>
      <rect x="368" y="253" width="224" height="84" rx="8"/>
      <rect x="368" y="356" width="224" height="84" rx="8"/>
      <rect x="664" y="253" width="224" height="84" rx="8"/>
      <rect x="664" y="356" width="224" height="84" rx="8"/>
    </g>
    <g fill="#e8edf3" font-size="14">
      <text x="88" y="290">Update navigation labels</text>
      <text x="88" y="393">Review empty state</text>
      <text x="384" y="290">Add status filter</text>
      <text x="384" y="393">Keyboard navigation</text>
      <text x="680" y="290">Polish board spacing</text>
      <text x="680" y="393">Document local preview</text>
    </g>
    <g fill="#95a3b7" font-size="11">
      <text x="88" y="315">N-101 / DESIGN</text>
      <text x="88" y="418">N-103 / REVIEW</text>
      <text x="384" y="315">N-102 / FRONTEND</text>
      <text x="384" y="418">N-104 / ACCESSIBILITY</text>
      <text x="680" y="315">N-105 / DESIGN</text>
      <text x="680" y="418">N-106 / DOCUMENTATION</text>
    </g>
  </g>
</svg>
